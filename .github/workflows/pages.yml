# Publish the animation viewer to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Builds _site/ with tools/build-site.mjs (the viewer only: no elements page, render tools or papers), then adds the clips from
# the release "videos" (uploaded from out/web/ with gh release upload).
# Two jobs, as in GitHub's own template: build uploads the site, deploy publishes it once that upload is finished.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/build-site.mjs
      # the clips the viewer plays (js/video.js) live on the release "videos", not in git; they go into _site/videos/
      - run: gh release download videos --repo "${{ github.repository }}" --pattern '*.mp4' --dir _site/videos
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ls -la _site _site/videos      # shows in the log what is being published
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
