<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animation elements</title>
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>
<header class="top">
  <a class="back" href="index.html" aria-label="Back to the animation">
    <svg viewBox="0 0 26 18" width="22" height="16" aria-hidden="true"><path d="M25 9H10" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 2.5 1 9 12 15.5Z" fill="currentColor"/></svg>
    Animation
  </a>
  <h1>Elements</h1>
  <p class="note">Click any element to see it large, play it, and change its colours or texture. Colours are shared: every element using that palette entry changes, here and in the animation (reload the animation to see it). Saved in this browser.</p>
</header>
<main id="sections"></main>

<dialog id="viewer" aria-label="Element">
  <div class="scrim" data-close></div>
  <div class="panel">
    <button type="button" class="icon close" data-close aria-label="Close">
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path d="M3 3 15 15M15 3 3 15" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>
    </button>
    <div class="main">
      <div class="stage"><canvas id="big"></canvas></div>
      <div class="bar">
        <button type="button" class="icon" id="prev" aria-label="Previous">
          <svg viewBox="0 0 26 18" width="26" height="18" aria-hidden="true" style="transform:scaleX(-1)"><path d="M1 9H16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M14 2.5 25 9 14 15.5Z" fill="currentColor"/></svg>
        </button>
        <button type="button" class="pill play" id="play">Play</button>
        <h2 id="name"></h2>
        <button type="button" class="pill" id="copyImg" title="Copy this view as a PNG with a transparent background">Copy PNG</button>
        <button type="button" class="icon" id="next" aria-label="Next">
          <svg viewBox="0 0 26 18" width="26" height="18" aria-hidden="true"><path d="M1 9H16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M14 2.5 25 9 14 15.5Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="controls" id="controls"></div>
  </div>
</dialog>

<script src="js/core/math.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/filters.js"></script>
<script src="js/look.js"></script>
<script src="js/palette-overrides.js"></script>
<script src="js/clay.js"></script>
<script src="js/core/arbor.js"></script>
<script src="js/core/builders.js"></script>
<script src="js/core/cell.js"></script>
<script src="js/core/kit.js"></script>
<script src="js/core/glyphs.js"></script>
<script src="js/scenes/common.js"></script>
<script src="js/scenes/molecules.js"></script>
<script src="js/scenes/culture.js"></script>
<script src="js/scenes/fluo.js"></script>
<script src="js/scenes/texture.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
