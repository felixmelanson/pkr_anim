<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AβO/PKR Signaling in AD</title>
<link rel="stylesheet" href="css/viewer.css">
</head>
<body>
<canvas id="c"></canvas>

<aside id="bridgeDebug" aria-label="Scene 1 and 2 position debug panel">
  <div class="bridge-debug-head">
    <strong>Scene 1–2 positions</strong>
    <button id="bridgeDebugReset" type="button">Reset</button>
  </div>
  <p>World-space offsets. Timing is unchanged.</p>
  <div id="bridgeDebugFields"></div>
  <button id="bridgeDebugCopy" class="bridge-debug-copy" type="button">Copy values</button>
</aside>

<div id="controls">
  <button id="ctlPrev" aria-label="Previous step">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
  </button>
  <button id="ctlPlay" aria-label="Pause">
    <svg class="icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none"><path d="M7 5v14l12-7z"/></svg>
  </button>
  <button id="ctlNext" aria-label="Next step">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
  </button>
  <button id="ctlReplay" class="phone-hide" aria-label="Replay step">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
  <input id="ctlScrub" type="range" min="0" max="20" step="0.02" value="0">
  <span id="stepLabel">1 / 14</span>
  <button id="ctlTheme" aria-label="Switch to light">
    <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 9 9 0 1 0 20.5 14.5z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
  </button>
  <a id="ctlGallery" class="phone-hide btn-link" href="gallery.html" aria-label="All elements" title="All elements: cells, glyphs, molecules">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
  </a>
</div>

<script src="js/core/math.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/look.js"></script>
<script src="js/palette-overrides.js"></script>
<script src="js/core/assets.js"></script>
<script src="js/clay.js"></script>
<script src="js/core/arbor.js"></script>
<script src="js/core/builders.js"></script>
<script src="js/core/cell.js"></script>
<script src="js/core/kit.js"></script>
<script src="js/core/glyphs.js"></script>
<script src="js/data.js"></script>

<script src="js/scenes/common.js"></script>
<script src="js/scenes/molecules.js"></script>
<script src="js/scenes/culture.js"></script>
<script src="js/scenes/fluo.js"></script>
<script src="js/scenes/texture.js"></script>
<script src="js/scenes/texgl.js"></script>
<script src="js/scenes/board.js"></script>
<script src="js/scenes/nor.js"></script>
<script src="js/scenes/steps.js"></script>

<script src="js/app.js"></script>
<script src="js/controls.js"></script>
<script src="js/bridge-debug.js"></script>
</body>
</html>
